<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Tiket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="wrap" style="max-width:460px">
    <div id="isi"></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
  (function () {
    var A = App, isi = A.$('#isi'), t = A.param('t');
    if (!t) { isi.innerHTML = '<div class="banner warn">Link tiket tidak lengkap.</div>'; return; }
    isi.innerHTML = A.memuat('Memuat e-tiket…');

    A.api('tiket', { t: t }).then(function (r) {
      var k = r.tiket, a = k.acara;
      document.title = 'E-Tiket ' + k.nama;
      var h = '<div class="tiket">';
      h += '<div class="atas"><small style="opacity:.85">E-TIKET</small><h2>' + A.esc(a.nama_acara) + '</h2>';
      if (a.tanggal_acara) h += '<div style="margin-top:6px">📅 ' + A.fmtTanggal(a.tanggal_acara) + ', ' + A.fmtJam(a.tanggal_acara) + '</div>';
      if (a.lokasi) h += '<div>📍 ' + A.esc(a.lokasi) + '</div>';
      h += '</div>';
      if (k.status === 'hadir') h += '<div class="banner ok" style="margin:14px 16px 0;text-align:center">✔ Sudah check-in ' + A.fmtWaktu(k.checkin_waktu) + '</div>';
      h += '<div class="qr" id="qr"></div>';
      h += '<div class="kode">' + A.esc(k.kode) + '</div>';
      h += '<div class="potong" style="margin-top:16px"></div><div class="isi"><dl class="dl">';
      h += '<dt>Nama</dt><dd>' + A.esc(k.nama) + '</dd>';
      if (k.nama_pasangan) h += '<dt>Pasangan</dt><dd>' + A.esc(k.nama_pasangan) + '</dd>';
      h += '<dt>Tiket</dt><dd>' + A.esc(k.jenis_nama) + ' (' + k.orang + ' orang)</dd>';
      if (k.jumlah_anak) h += '<dt>Penitipan anak</dt><dd>' + k.jumlah_anak + ' anak (usia ' + A.esc(String(k.usia_anak).split(',').join(', ')) + ' th)</dd>';
      h += '</dl><p class="hint" style="margin-top:14px">Tunjukkan QR code ini kepada panitia saat registrasi ulang. Simpan dengan screenshot atau cetak halaman ini.</p></div></div>';
      h += '<div class="btn-grup no-print" style="margin-top:16px;justify-content:center"><button class="btn sekunder" onclick="window.print()">Cetak / Simpan PDF</button></div>';
      isi.innerHTML = h;
      new QRCode(document.getElementById('qr'), { text: k.token, width: 460, height: 460, correctLevel: QRCode.CorrectLevel.M });
    }).catch(function (e) {
      isi.innerHTML = '<div class="card"><div class="banner danger">' + A.esc(e.message) + '</div><a href="status.html">Cek status pendaftaran</a></div>';
    });
  })();
  </script>
</body>
</html>
