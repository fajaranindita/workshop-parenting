<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pembayaran</title>
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div id="isi"></div>
    <p class="footer"><a href="index.html">Halaman acara</a> · <a href="status.html">Cek status</a></p>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>/* Cek file situs sinkron */(function(){var tampil=function(m){var d=document.createElement('div');d.setAttribute('style','background:#b4423a;color:#fff;padding:14px 16px;font:600 15px/1.5 system-ui,sans-serif;text-align:center');d.textContent=m;document.body.insertBefore(d,document.body.firstChild);};if(!window.App||window.App.VERSI!=='2026.11.28.3'){tampil('Halaman belum bisa dipakai: file situs tidak sinkron (app.js berbeda versi). Panitia: unggah ulang SEMUA file folder web/ kecuali config.js.');}if(window.API_URL===undefined){tampil('Halaman belum bisa dipakai: config.js tidak ditemukan.');}})();</script>
  <script>
  (function () {
    var A = App, isi = A.$('#isi');
    var kode = A.param('k'), akses = A.param('a'), baru = A.param('baru') === '1';
    var p = null, fileSiap = null, sudahMuatUlang = false;

    if (!kode || !akses) {
      isi.innerHTML = '<div class="card"><div class="banner warn">Link tidak lengkap. Silakan buka halaman <a href="status.html">Cek Status</a>.</div></div>';
      return;
    }
    muat();

    function muat() {
      isi.innerHTML = A.memuat('Memuat data pembayaran…');
      A.api('infoBayar', { kode: kode, akses: akses })
        .then(function (r) { p = r.peserta; tampil(); })
        .catch(function (e) { isi.innerHTML = '<div class="card"><div class="banner danger">' + A.esc(e.message) + '</div></div>'; });
    }

    function linkIni() { return A.halaman('bayar.html', { k: kode, a: akses }); }

    /** Langkah progres: 1 Daftar · 2 Transfer & unggah bukti · 3 Verifikasi · 4 E-tiket */
    function langkah() {
      var posisi = { menunggu_bayar: 1, ditolak: 1, menunggu_verifikasi: 2, lunas: 4, hadir: 4 }[p.status];
      if (posisi === undefined) return '';
      var daftar = ['Daftar', 'Transfer & unggah bukti', 'Verifikasi panitia', 'E-tiket terbit'];
      return '<ol class="langkah">' + daftar.map(function (t, i) {
        var kelas = i < posisi ? 'selesai' : (i === posisi ? 'sekarang' : '');
        return '<li class="' + kelas + '"><span class="bulat">' + (i < posisi ? '✓' : i + 1) + '</span><span class="teks">' + t + '</span></li>';
      }).join('') + '</ol>';
    }

    function kartuKode() {
      var h = '<div class="card">' + langkah();
      h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">';
      h += '<div><small>Kode registrasi</small><div style="font-size:1.4rem;font-weight:800;letter-spacing:.06em">' + A.esc(p.kode) + '</div></div>' + A.badge(p.status) + '</div>';
      h += '<p class="hint" style="margin-top:8px">Simpan kode ini. Halaman ini bisa dibuka lagi lewat menu Cek Status (kode + nomor WA).</p>';
      h += '<a class="btn wa kecil" target="_blank" rel="noopener" href="' + A.linkWA(p.wa, 'Pendaftaran ' + p.acara.nama_acara + '\nKode: ' + p.kode + '\nTotal: ' + A.rupiah(p.nominal) + '\nLink pembayaran & tiket: ' + linkIni()) + '">Simpan link ini ke WhatsApp saya</a>';
      return h + '</div>';
    }

    function isiInstruksi(adaBatas) {
      var nom = String(p.nominal), unik = ('00' + p.kode_unik).slice(-3);
      var depan = A.rupiah(p.nominal).slice(0, -3);
      var h = '<div class="nominal-besar">' + depan + '<span class="unik">' + unik + '</span></div>';
      h += '<p class="hint">Mohon transfer <b>persis sampai 3 digit terakhir</b> (kode unik ' + unik + ') agar pembayaran mudah dicocokkan.</p>';
      h += '<button class="btn sekunder kecil" data-salin="' + nom + '">Salin nominal</button>';
      h += '<div class="ringkasan"><div class="baris"><span>' + A.esc(p.jenis_nama) + '</span><span>' + A.rupiah(p.harga_tiket) + '</span></div>';
      if (p.jumlah_anak) h += '<div class="baris"><span>Penitipan ' + p.jumlah_anak + ' anak</span><span>' + (p.biaya_anak ? A.rupiah(p.biaya_anak) : 'Gratis') + '</span></div>';
      h += '<div class="baris"><span>Kode unik</span><span>' + A.rupiah(p.kode_unik) + '</span></div>';
      h += '<div class="baris total"><span>Total</span><span>' + A.rupiah(p.nominal) + '</span></div></div>';
      h += '<h3 style="margin-top:18px">Ke rekening</h3>';
      h += '<div class="salin-baris"><div><small>Bank ' + A.esc(p.bank === 'BSI' ? 'BSI (Bank Syariah Indonesia)' : p.bank) + '</small><div class="nilai">' + A.esc(p.no_rekening) + '</div><small>a.n. ' + A.esc(p.atas_nama) + '</small></div><button class="btn sekunder kecil" data-salin="' + A.esc(p.no_rekening) + '">Salin</button></div>';
      if (adaBatas) h += '<div class="banner warn" style="margin-top:12px">Bayar sebelum <b>' + A.fmtWaktu(p.batas_bayar) + '</b><br>Sisa waktu: <b id="mundur"></b></div>';
      return h;
    }

    function isiUnggah() {
      var h = '';
      if (A.dalamAplikasi()) h += '<div class="banner warn" style="margin-bottom:12px">Halaman ini terbuka di dalam aplikasi (' + A.esc(A.infoPerangkat().split(' · ')[1]) + '). Jika Galeri tidak mau terbuka, ketuk <b>⋯</b> di pojok kanan atas lalu pilih <b>Buka di browser</b>.</div>';
      return h + '<label class="unggah" for="file" id="kotakUnggah"><div>📎 <b>Pilih foto/screenshot bukti transfer</b></div><small>JPG, PNG, HEIC, atau PDF · maks. 2,5 MB · screenshot dari aplikasi bank paling mudah</small><div id="pratinjau"></div></label>' +
        '<input type="file" id="file" accept="image/*,application/pdf,.heic,.heif" hidden>' +
        '<div id="errFile" class="banner danger" hidden style="margin-top:12px"></div>' +
        '<button class="btn blok" id="kirim" style="margin-top:14px" disabled>Kirim Bukti Transfer</button>';
    }

    function tampil(setelahUnggah) {
      var h = '';
      if (baru && p.status === 'menunggu_bayar') h += '<div class="banner ok"><b>Pendaftaran berhasil!</b> Tinggal 2 langkah lagi: transfer, lalu unggah bukti transfer di bawah.</div>';
      h += kartuKode();

      if (p.status === 'lunas' || p.status === 'hadir') {
        h += '<div class="card kartu-sukses"><div class="ikon-sukses">✓</div><h2>Pembayaran terverifikasi</h2><p>E-tiket Anda sudah terbit. Tunjukkan QR code-nya saat registrasi ulang.</p>';
        h += '<a class="btn blok" href="' + A.halaman('tiket.html', { t: p.token_tiket }) + '">Lihat E-Tiket</a></div>';
        isi.innerHTML = h; return;
      }
      if ((p.status === 'kedaluwarsa' || p.status === 'batal') && p.pengganti) {
        var linkBaru = A.halaman('bayar.html', { k: p.pengganti.kode, a: p.pengganti.akses });
        h += '<div class="card"><div class="banner ok"><b>Anda punya pendaftaran yang lebih baru.</b><br>Link ini milik pendaftaran lama (' + A.esc(p.kode) + ') yang sudah tidak aktif. Nomor WhatsApp Anda terdaftar di pendaftaran <b>' + A.esc(p.pengganti.kode) + '</b> (' + A.esc(A.LABEL_STATUS[p.pengganti.status] || p.pengganti.status) + ').</div>';
        h += '<a class="btn blok" href="' + A.esc(linkBaru) + '">Buka pendaftaran terbaru</a>';
        h += '<p class="hint" style="margin-top:10px">Jika Anda sudah transfer untuk pendaftaran lama, hubungi panitia dan sertakan kedua kode registrasi.</p>' + kontak() + '</div>';
        isi.innerHTML = h; return;
      }
      if (p.status === 'kedaluwarsa') {
        h += '<div class="card"><div class="banner warn">Batas waktu pembayaran sudah lewat dan pendaftaran ini tidak aktif lagi.</div>';
        h += '<p>Jika Anda <b>sudah transfer</b>, hubungi panitia dengan menyertakan kode registrasi. Jika belum, silakan daftar ulang bila kuota masih tersedia.</p>';
        h += kontak() + ' <a class="btn sekunder" href="index.html#daftar">Daftar ulang</a></div>';
        isi.innerHTML = h; return;
      }
      if (p.status === 'batal') {
        h += '<div class="card"><div class="banner warn">Pendaftaran ini sudah dibatalkan oleh panitia.' + (p.alasan_tolak ? ' Keterangan: ' + A.esc(p.alasan_tolak) : '') + '</div>' + kontak() + '</div>';
        isi.innerHTML = h; return;
      }

      if (p.status === 'menunggu_verifikasi') {
        // Kartu sukses langsung di atas, rincian & ganti bukti dilipat di bawahnya
        h += '<div class="card kartu-sukses' + (setelahUnggah ? ' sorot' : '') + '" id="sukses"><div class="ikon-sukses">✓</div>';
        h += '<h2>Bukti transfer terkirim</h2><p>Terima kasih! Bukti diterima ' + A.fmtWaktu(p.bukti_waktu) + '. <b>Tidak ada lagi yang perlu Anda lakukan sekarang.</b></p>';
        h += '<div class="selanjutnya"><h3>Apa selanjutnya?</h3><ol>';
        h += '<li>Panitia memeriksa pembayaran Anda.</li>';
        h += '<li>Setelah terverifikasi, <b>e-tiket dikirim lewat WhatsApp</b> ke nomor ' + A.esc(p.wa) + '.</li>';
        h += '<li>Status bisa dicek kapan saja di halaman ini atau menu <a href="status.html">Cek Status</a>.</li>';
        h += '</ol></div></div>';
        h += '<details class="card lipat"><summary>Lihat rincian pembayaran</summary>' + isiInstruksi(false) + '</details>';
        h += '<details class="card lipat"><summary>Salah unggah? Ganti bukti transfer</summary>' + isiUnggah() + '</details>';
      } else {
        if (p.status === 'ditolak') {
          h += '<div class="card"><div class="banner danger"><b>Bukti pembayaran belum bisa diverifikasi.</b><br>Alasan: ' + A.esc(p.alasan_tolak) + '<br>Silakan unggah ulang sebelum batas waktu (Langkah 2).</div></div>';
        }
        h += '<div class="card"><p class="nomor-langkah">Langkah 1</p><h2>Transfer tepat sebesar</h2>' + isiInstruksi(true) + '</div>';
        h += '<div class="card"><p class="nomor-langkah">Langkah 2</p><h2>' + (p.status === 'ditolak' ? 'Unggah ulang bukti transfer' : 'Unggah bukti transfer') + '</h2>' + isiUnggah() + '</div>';
      }
      h += '<div class="card" style="text-align:center">' + kontak() + '</div>';
      isi.innerHTML = h;

      var adaBatas = p.status === 'menunggu_bayar' || p.status === 'ditolak';
      if (adaBatas && !sudahMuatUlang) {
        A.hitungMundur(p.batas_bayar, A.$('#mundur'), function () { sudahMuatUlang = true; setTimeout(muat, 1500); });
      }
      A.$$('[data-salin]').forEach(function (b) { b.addEventListener('click', function () { A.salin(b.getAttribute('data-salin')); }); });
      A.$('#file').addEventListener('change', pilihFile);
      A.$('#kirim').addEventListener('click', kirimBukti);
      if (setelahUnggah && A.$('#sukses')) {
        A.$('#sukses').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function kontak(pesanTambahan) {
      if (!p.acara.kontak_wa) return '';
      return '<a class="btn sekunder' + (pesanTambahan ? ' kecil' : '') + '" target="_blank" rel="noopener" href="' + A.linkWA(p.acara.kontak_wa, 'Halo panitia, saya ' + p.nama + ' (kode ' + p.kode + '). ' + (pesanTambahan || '')) + '">Hubungi panitia via WA</a>';
    }

    /** Pesan kendala tetap tampil (bukan toast yang hilang), lengkap dengan saran dan tombol bantuan */
    function tampilErrFile(pesan, saran) {
      var el = A.$('#errFile');
      if (!el) { A.toast(pesan, true); return; }
      el.innerHTML = '<b>' + A.esc(pesan) + '</b>' + (saran ? '<br>' + saran : '') +
        (p.acara.kontak_wa ? '<br><span style="display:inline-block;margin-top:8px">Masih belum bisa? ' + kontak('Saya tidak bisa mengunggah bukti transfer. Pesan yang muncul: "' + pesan + '". ') + '</span>' : '');
      el.hidden = false;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    function lapor(pesan, f) {
      A.api('laporGagal', { kode: kode, akses: akses, pesan: pesan, perangkat: A.infoPerangkat(),
        file: f ? ((A.jenisFile(f) || 'jenis tidak diketahui') + ', ' + Math.round(f.size / 1024) + ' KB') : '' }).catch(function () { });
    }

    function pilihFile(e) {
      var f = e.target.files[0];
      if (!f) return;
      fileSiap = null;
      A.$('#kirim').disabled = true;
      A.$('#errFile').hidden = true;
      A.$('#pratinjau').innerHTML = '<div class="memuat" style="padding:10px">Menyiapkan file…</div>';
      A.siapkanFile(f).then(function (hasil) {
        fileSiap = hasil;
        A.$('#pratinjau').innerHTML = hasil.pratinjau ? '<img src="' + hasil.pratinjau + '" alt="Pratinjau bukti">'
          : '<p style="margin-top:10px">📄 ' + A.esc(f.name) + (hasil.asli ? '<br><small class="muted">Foto akan dikirim apa adanya; panitia tetap bisa melihatnya.</small>' : '') + '</p>';
        A.$('#kirim').disabled = false;
      }).catch(function (err) {
        A.$('#pratinjau').innerHTML = '';
        tampilErrFile(err.message, err.saran);
        lapor(err.message, f);
      });
    }

    function kirimBukti() {
      if (!fileSiap) return;
      var btn = A.$('#kirim');
      btn.disabled = true; btn.textContent = 'Mengunggah…';
      A.api('unggahBukti', { kode: kode, akses: akses, mime: fileSiap.mime, data: fileSiap.data })
        .then(function (r) {
          p = r.peserta; baru = false;
          tampil(true); // kartu sukses di atas + gulir otomatis ke sana
        })
        .catch(function (err) {
          btn.disabled = false; btn.textContent = 'Kirim Bukti Transfer';
          if (err.kode === 'KEDALUWARSA') { A.toast(err.message, true); muat(); return; }
          var jaringan = /terhubung/i.test(err.message);
          tampilErrFile(err.message, jaringan ? 'Pindah ke Wi-Fi atau tempat bersinyal kuat, tunggu sebentar, lalu klik <b>Kirim Bukti Transfer</b> lagi.' : 'Silakan coba sekali lagi.');
          if (jaringan) lapor(err.message);
        });
    }
  })();
  </script>
</body>
</html>
