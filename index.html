<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendaftaran Workshop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bannerPratinjau" class="pratinjau-banner" hidden>MODE PRATINJAU — pendaftaran tidak akan dikirim</div>
  <div id="landing" class="lp" hidden></div>
  <div id="barForm" class="lp-bar-form" hidden><div class="lp-isi"><a href="#">← Kembali ke info acara</a></div></div>
  <div class="wrap" id="wrapForm">
    <div id="isi"></div>
    <p class="footer">Sudah mendaftar? <a href="status.html">Cek status pendaftaran</a></p>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="landing.js"></script>
  <script>/* Cek file situs sinkron */(function(){var tampil=function(m){var d=document.createElement('div');d.setAttribute('style','background:#b4423a;color:#fff;padding:14px 16px;font:600 15px/1.5 system-ui,sans-serif;text-align:center');d.textContent=m;document.body.insertBefore(d,document.body.firstChild);};if(!window.App||window.App.VERSI!=='2026.11.26b'){tampil('Halaman belum bisa dipakai: file situs tidak sinkron (app.js berbeda versi). Panitia: unggah ulang SEMUA file folder web/ kecuali config.js.');}if(window.API_URL===undefined){tampil('Halaman belum bisa dipakai: config.js tidak ditemukan.');}if(window.LANDING_VERSI!=='2026.11.26b'){tampil('Halaman belum bisa dipakai: landing.js tidak ditemukan atau berbeda versi. Panitia: unggah ulang SEMUA file folder web/ kecuali config.js.');}})();</script>
  <script>
  (function () {
    var A = App, isi = A.$('#isi');
    var pratinjau = A.param('pratinjau') === '1';
    var pratinjauLanding = A.param('pratinjau') === 'landing';
    var info = null, mode = '', pilihanAwal = '';

    isi.innerHTML = A.memuat('Memuat info acara…');

    var muat = pratinjau
      ? Promise.resolve(A.ambil('ws_pratinjau')).then(function (d) {
          if (!d) throw new Error('Data pratinjau tidak ditemukan. Buka pratinjau dari halaman Pengaturan.');
          A.$('#bannerPratinjau').hidden = false; return d;
        })
      : A.api('publik').then(function (d) {
          if (pratinjauLanding) {
            // Pratinjau landing dari dashboard: data acara & tiket asli, isi landing dari draf
            var draf = A.ambil('ws_pratinjau_landing');
            if (!draf) throw new Error('Data pratinjau landing tidak ditemukan. Buka pratinjau dari tab Landing Page.');
            d.landing = draf;
            pratinjau = true;
            A.$('#bannerPratinjau').hidden = false;
          }
          return d;
        });

    muat.then(function (d) { info = d; arahkan(); window.addEventListener('hashchange', arahkan); })
        .catch(function (e) { isi.innerHTML = '<div class="banner danger">' + A.esc(e.message) + '</div>'; });

    /** Landing page (jika aktif) atau formulir (#daftar / #daftar-<id tiket>) */
    function arahkan() {
      var hash = location.hash || '';
      var modeBaru = info.landing && window.Landing && !/^#daftar/.test(hash) ? 'landing' : 'form';
      var pilih = /^#daftar-/.test(hash) ? decodeURIComponent(hash.slice(8)) : '';
      if (modeBaru === mode && (mode === 'landing' || pilih === pilihanAwal)) return;
      mode = modeBaru; pilihanAwal = pilih;
      A.$('#landing').hidden = mode !== 'landing';
      A.$('#wrapForm').hidden = mode !== 'form';
      A.$('#barForm').hidden = !(mode === 'form' && info.landing);
      if (mode === 'landing') {
        window.Landing.render(info, A.$('#landing'), { pratinjau: pratinjau });
        if (hash && hash.length > 1) { var t = document.getElementById(hash.slice(1)); if (t) t.scrollIntoView(); }
        else window.scrollTo(0, 0);
      } else {
        tampil();
        window.scrollTo(0, 0);
      }
    }

    function tampil() {
      var a = info.acara;
      document.title = 'Pendaftaran ' + (a.nama_acara || 'Workshop');
      var h = '';
      h += '<div class="card hero">';
      h += '<h1>' + A.esc(a.nama_acara) + '</h1>';
      if (a.deskripsi) h += '<p style="opacity:.95;white-space:pre-line">' + A.esc(a.deskripsi) + '</p>';
      h += '<div class="meta">';
      if (a.tanggal_acara) h += '<div>📅 <span>' + A.fmtTanggal(a.tanggal_acara) + ', ' + A.fmtJam(a.tanggal_acara) + '</span></div>';
      if (a.lokasi) h += '<div>📍 <span>' + A.esc(a.lokasi) + (a.link_maps ? ' · <a href="' + A.esc(a.link_maps) + '" target="_blank" rel="noopener">Lihat peta</a>' : '') + '</span></div>';
      h += '</div></div>';

      // Tiket yang bisa dibeli saat ini (tiket berjadwal/pre-sale bisa dijual walau pendaftaran umum belum dibuka)
      var bisa = function (t) { return t.bisa_dibeli !== undefined ? t.bisa_dibeli : (info.status === 'buka' && t.sisa > 0); };
      var adaJual = info.tiket.some(bisa);
      if (!adaJual) {
        if (info.status === 'belum_buka') h += '<div class="card"><div class="banner info">Pendaftaran dibuka pada <b>' + A.fmtTanggal(info.buka) + ', ' + A.fmtJam(info.buka) + '</b>.</div>' + daftarHarga() + '</div>';
        else if (info.status === 'tutup') h += '<div class="card"><div class="banner warn">Pendaftaran sudah ditutup. Terima kasih atas antusiasmenya!</div></div>';
        else if (info.status === 'belum_diatur') h += '<div class="card"><div class="banner info">Pendaftaran belum dibuka. Pantau terus info dari panitia.</div></div>';
        else h += '<div class="card"><div class="banner warn">Maaf, saat ini belum ada tiket yang bisa dipesan.</div>' + daftarHarga() + '</div>';
        isi.innerHTML = h; return;
      }

      h += '<form id="form" class="card" novalidate>';
      h += '<h2>Formulir Pendaftaran</h2>';
      if (info.early_bird) h += '<div class="banner ok">🎉 Harga early bird berlaku sampai ' + A.fmtTanggal(info.early_bird_akhir) + '.</div>';

      h += '<label>Pilih tiket</label><div class="pilihan">';
      if (info.status !== 'buka') h += '<div class="banner info">Hari ini tersedia tiket khusus: <b>' + info.tiket.filter(bisa).map(function (t) { return A.esc(t.nama); }).join(', ') + '</b>.</div>';
      info.tiket.forEach(function (t, i) {
        var habis = !bisa(t);
        h += '<label class="opsi' + (habis ? ' habis' : '') + '"><span class="kiri"><input type="radio" name="jenis" value="' + A.esc(t.id) + '"' + (habis ? ' disabled' : '') + '>';
        h += '<span><span class="nama">' + A.esc(t.nama) + '</span>' + A.badgeVip(t);
        if (t.keterangan) h += '<br><small class="ket">' + A.esc(t.keterangan) + '</small>';
        h += '<br><small>' + (t.orang > 1 ? 'Untuk ' + t.orang + ' orang · ' : '') + (habis ? A.esc(t.alasan || 'Habis') : (t.sisa <= 20 ? 'Sisa ' + t.sisa + ' tiket' : 'Tersedia')) + '</small></span></span>';
        h += '<span class="harga">' + (t.harga < t.harga_normal ? '<span class="coret">' + A.rupiah(t.harga_normal) + '</span>' : '') + A.rupiah(t.harga) +
          (t.orang > 2 ? '<small class="per-orang">' + A.rupiah(Math.round(t.harga / t.orang)) + '/orang</small>' : '') + '</span></label>';
      });
      h += '</div>';

      h += '<label for="nama">Nama lengkap</label><input id="nama" type="text" autocomplete="name" maxlength="100" required>';
      if (info.catatan_nama) h += '<div class="hint catatan-nama">✎ ' + A.esc(info.catatan_nama) + '</div>';
      h += '<label>Jenis kelamin</label>' + pilihJK(0);
      h += '<div id="blokAnggota" hidden></div>';
      h += '<label for="wa">Nomor WhatsApp</label><input id="wa" type="tel" inputmode="tel" placeholder="08xxxxxxxxxx" autocomplete="tel" required>';
      h += '<div class="hint">E-tiket dan info acara akan dikirim lewat WhatsApp.</div>';
      h += '<label for="email">Email <span class="opsional">(opsional)</span></label><input id="email" type="email" autocomplete="email">';
      if (info.asal && info.asal.length) {
        h += '<label for="asal">Asal / unit</label><select id="asal"><option value="">— Pilih asal Anda —</option>';
        info.asal.forEach(function (o) { h += '<option value="' + A.esc(o) + '">' + A.esc(o) + '</option>'; });
        h += '<option value="__lain">Lainnya…</option></select>';
        h += '<input id="asalLain" type="text" maxlength="60" placeholder="Tulis asal Anda" hidden style="margin-top:8px">';
      }

      var pt = info.penitipan;
      if (pt.aktif) {
        h += '<div class="ringkasan"><label class="cek"><input type="checkbox" id="pakaiTitip"' + (pt.sisa < 1 ? ' disabled' : '') + '> <span><b>Saya butuh penitipan anak</b><br><small>Usia ' + pt.usia_min + '–' + pt.usia_maks + ' tahun, maks. ' + pt.maks + ' anak · ' + (pt.biaya > 0 ? A.rupiah(pt.biaya) + '/anak' : 'Gratis') + (pt.sisa < 1 ? ' · <b>Kuota habis</b>' : (pt.sisa <= 10 ? ' · sisa ' + pt.sisa + ' tempat' : '')) + '</small></span></label>';
        h += '<div id="blokAnak" hidden style="margin-top:10px"><div id="daftarAnak"></div><button type="button" class="btn sekunder kecil" id="tambahAnak">+ Tambah anak</button></div></div>';
      }

      if (info.pertanyaan_aktif !== false) h += '<label for="tanya">Pertanyaan atau topik yang ingin dibahas <span class="opsional">(opsional)</span></label><textarea id="tanya" maxlength="500" placeholder="Misalnya: cara menghadapi tantrum anak usia 3 tahun"></textarea>';

      h += '<div class="ringkasan" id="ringkasan"></div>';
      h += '<label class="cek" style="margin-top:14px"><input type="checkbox" id="cekNama"> <span>Saya sudah memeriksa penulisan nama' + '<span id="cekNamaSemua"></span>' + ' dan sudah benar.</span></label>';
      h += '<label class="cek" style="margin-top:10px"><input type="checkbox" id="setuju"> <span>Saya setuju data di atas digunakan panitia hanya untuk keperluan acara ini.</span></label>';
      h += '<div id="pesanError" class="banner danger" hidden style="margin-top:14px"></div>';
      h += '<button class="btn blok" id="kirim" type="submit" style="margin-top:16px">Daftar &amp; Lanjut ke Pembayaran</button>';
      h += '<p class="hint" style="text-align:center;margin-top:10px">Batas pembayaran ' + info.batas_bayar_jam + ' jam setelah mendaftar.</p>';
      h += '</form>';
      isi.innerHTML = h;
      pasangEvent();
      if (pilihanAwal) {
        var r = A.$('input[name=jenis][value="' + pilihanAwal.replace(/"/g, '') + '"]');
        if (r && !r.disabled) { r.checked = true; r.dispatchEvent(new Event('change')); }
      }
    }

    function daftarHarga() {
      return '<h3>Harga tiket</h3>' + info.tiket.map(function (t) {
        return '<div class="baris"><span>' + A.esc(t.nama) + (t.alasan && t.kode_alasan !== 'belum_buka' ? '<br><small class="muted">' + A.esc(t.alasan) + '</small>' : '') + '</span><b>' + A.rupiah(t.harga) + '</b></div>';
      }).join('');
    }

    function jenisDipilih() {
      var r = A.$('input[name=jenis]:checked');
      return r ? info.tiket.filter(function (t) { return t.id === r.value; })[0] : null;
    }

    function usiaAnak() {
      if (!A.$('#pakaiTitip') || !A.$('#pakaiTitip').checked) return [];
      return A.$$('.usiaAnak').map(function (i) { return i.value; });
    }

    function tambahAnak() {
      var pt = info.penitipan;
      var n = A.$$('.usiaAnak').length;
      if (n >= Math.min(pt.maks, pt.sisa)) { A.toast('Maksimal ' + Math.min(pt.maks, pt.sisa) + ' anak.', true); return; }
      var div = document.createElement('div');
      div.className = 'anak-baris';
      div.innerHTML = '<span>Anak ' + (n + 1) + '</span><input type="number" class="usiaAnak" min="' + pt.usia_min + '" max="' + pt.usia_maks + '" placeholder="Usia"><span class="muted">tahun</span>' +
        (n > 0 ? '<button type="button" class="btn sekunder kecil hapusAnak">Hapus</button>' : '');
      A.$('#daftarAnak').appendChild(div);
      perbaruiRingkasan();
    }

    /** Pilihan jenis kelamin untuk orang ke-i (0 = pendaftar) */
    function pilihJK(i) {
      return '<div class="jk" role="radiogroup">' +
        '<label><input type="radio" name="jk' + i + '" value="L"> Laki-laki</label>' +
        '<label><input type="radio" name="jk' + i + '" value="P"> Perempuan</label></div>';
    }
    function nilaiJK(i) { var r = A.$('input[name=jk' + i + ']:checked'); return r ? r.value : ''; }

    /** Kolom nama + jenis kelamin anggota lain: pasangan atau anggota grup (semua wajib) */
    function renderAnggota(t) {
      var blok = A.$('#blokAnggota');
      var lamaNama = A.$$('.namaAnggota').map(function (i) { return i.value; });
      var lamaJK = lamaNama.map(function (_, i) { return nilaiJK(i + 1); });
      A.$('#cekNamaSemua').textContent = t && t.orang > 2 ? ' semua anggota' : (t && t.orang === 2 ? ' saya dan pasangan' : '');
      if (!t || t.orang < 2) { blok.hidden = true; blok.innerHTML = ''; return; }
      var h = '';
      if (t.orang === 2) {
        h = '<div class="orang-blok"><label for="anggota0">Nama pasangan</label><input id="anggota0" class="namaAnggota" type="text" maxlength="100">' +
          '<label>Jenis kelamin pasangan</label>' + pilihJK(1) + '</div>';
      } else {
        h = '<div class="hint" style="margin-top:14px">Anda tercatat sebagai <b>anggota 1</b> sekaligus penanggung jawab grup. Satu e-tiket berlaku untuk ' + t.orang + ' orang. Isi nama lengkap dan jenis kelamin semua anggota (dipakai untuk sertifikat dan pengaturan tempat duduk).</div>';
        for (var i = 0; i < t.orang - 1; i++) {
          h += '<div class="orang-blok"><label for="anggota' + i + '">Anggota ' + (i + 2) + '</label>' +
            '<input id="anggota' + i + '" class="namaAnggota" type="text" maxlength="100" placeholder="Nama lengkap anggota ' + (i + 2) + '">' +
            pilihJK(i + 1) + '</div>';
        }
      }
      blok.innerHTML = h; blok.hidden = false;
      A.$$('.namaAnggota').forEach(function (inp, i) {
        if (lamaNama[i]) inp.value = lamaNama[i];
        if (lamaJK[i]) { var r = A.$('input[name=jk' + (i + 1) + '][value=' + lamaJK[i] + ']'); if (r) r.checked = true; }
      });
    }

    function perbaruiRingkasan() {
      var t = jenisDipilih();
      var el = A.$('#ringkasan');
      if (!t) { el.innerHTML = '<span class="muted">Pilih jenis tiket untuk melihat total.</span>'; return; }
      var anak = usiaAnak().length, biayaAnak = anak * info.penitipan.biaya;
      var h = '<div class="baris"><span>' + A.esc(t.nama) + '</span><span>' + A.rupiah(t.harga) + '</span></div>';
      if (anak) h += '<div class="baris"><span>Penitipan ' + anak + ' anak</span><span>' + (biayaAnak ? A.rupiah(biayaAnak) : 'Gratis') + '</span></div>';
      h += '<div class="baris total"><span>Subtotal</span><span>' + A.rupiah(t.harga + biayaAnak) + '</span></div>';
      h += '<div class="hint" style="margin-top:6px">Saat Anda menekan <b>Daftar</b>, sistem menambahkan <b>kode unik Rp1–999</b> agar transfer Anda mudah dicocokkan. ' +
        'Total pasti yang harus ditransfer langsung tampil di halaman pembayaran.</div>';
      el.innerHTML = h;
    }

    function pasangEvent() {
      A.$$('input[name=jenis]').forEach(function (r) {
        r.addEventListener('change', function () {
          var t = jenisDipilih();
          renderAnggota(t);
          perbaruiRingkasan();
        });
      });
      var cekTitip = A.$('#pakaiTitip');
      if (cekTitip) {
        cekTitip.addEventListener('change', function () {
          A.$('#blokAnak').hidden = !cekTitip.checked;
          if (cekTitip.checked && !A.$$('.usiaAnak').length) tambahAnak();
          perbaruiRingkasan();
        });
        A.$('#tambahAnak').addEventListener('click', tambahAnak);
        A.$('#daftarAnak').addEventListener('click', function (e) {
          if (e.target.classList.contains('hapusAnak')) { e.target.parentNode.remove(); perbaruiRingkasan(); }
        });
      }
      var selAsal = A.$('#asal');
      if (selAsal) selAsal.addEventListener('change', function () {
        var lain = selAsal.value === '__lain';
        A.$('#asalLain').hidden = !lain;
        if (lain) A.$('#asalLain').focus();
      });
      perbaruiRingkasan();
      A.$('#form').addEventListener('submit', kirim);
    }

    function tampilError(pesan) {
      var el = A.$('#pesanError');
      el.textContent = pesan; el.hidden = false;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function kirim(e) {
      e.preventDefault();
      A.$('#pesanError').hidden = true;
      var t = jenisDipilih();
      var selAsal = A.$('#asal'), asal = '';
      if (selAsal) asal = selAsal.value === '__lain' ? 'Lainnya: ' + A.$('#asalLain').value.trim() : selAsal.value;
      var jk = [];
      for (var i = 0; i < (t ? t.orang : 1); i++) jk.push(nilaiJK(i));
      var data = {
        jenis_id: t ? t.id : '',
        nama: A.$('#nama').value.trim(),
        anggota: A.$$('.namaAnggota').map(function (i) { return i.value.trim(); }),
        wa: A.$('#wa').value.trim(),
        email: A.$('#email').value.trim(),
        usia_anak: usiaAnak(),
        pertanyaan: A.$('#tanya') ? A.$('#tanya').value.trim() : '',
        asal: asal,
        jenis_kelamin: jk,
        persetujuan: A.$('#setuju').checked
      };
      if (!t) return tampilError('Silakan pilih jenis tiket.');
      if (data.nama.length < 3) return tampilError('Nama lengkap wajib diisi.');
      if (!jk[0]) return tampilError('Pilih jenis kelamin Anda.');
      for (var j = 0; j < t.orang - 1; j++) {
        var label = t.orang === 2 ? 'pasangan' : 'anggota ' + (j + 2);
        if ((data.anggota[j] || '').length < 2) return tampilError('Nama ' + label + ' wajib diisi.');
        if (!jk[j + 1]) return tampilError('Pilih jenis kelamin ' + label + '.');
      }
      if (data.wa.replace(/\D/g, '').length < 9) return tampilError('Nomor WhatsApp tidak valid.');
      var pt = info.penitipan;
      var usiaSalah = data.usia_anak.some(function (u) { return u === '' || +u < pt.usia_min || +u > pt.usia_maks; });
      if (usiaSalah) return tampilError('Isi usia anak antara ' + pt.usia_min + '–' + pt.usia_maks + ' tahun.');
      if (selAsal && (!selAsal.value || (selAsal.value === '__lain' && asal.length < 11))) return tampilError('Silakan pilih atau tulis asal Anda.');
      if (!A.$('#cekNama').checked) return tampilError('Mohon periksa penulisan nama, lalu centang konfirmasinya.');
      if (!data.persetujuan) return tampilError('Mohon centang persetujuan penggunaan data.');
      if (pratinjau) { A.toast('Mode pratinjau: formulir valid, tidak dikirim.'); return; }

      var btn = A.$('#kirim');
      btn.disabled = true; btn.textContent = 'Memproses…';
      A.api('daftar', { data: data }).then(function (res) {
        A.simpan('ws_terakhir', { kode: res.kode, akses: res.akses });
        location.href = A.halaman('bayar.html', { k: res.kode, a: res.akses, baru: '1' });
      }).catch(function (err) {
        tampilError(err.message);
        btn.disabled = false; btn.textContent = 'Daftar & Lanjut ke Pembayaran';
        if (err.kode === 'HABIS') A.api('publik').then(function (d) { info = d; });
      });
    }
  })();
  </script>
</body>
</html>
