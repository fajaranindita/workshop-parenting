<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cek Status Pendaftaran</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <form class="card" id="form">
      <h1>Cek Status Pendaftaran</h1>
      <p class="muted">Masukkan kode registrasi dan nomor WhatsApp yang dipakai saat mendaftar.</p>
      <label for="kode">Kode registrasi</label>
      <input id="kode" type="text" placeholder="WS-XXXXX" autocapitalize="characters" required>
      <label for="wa">Nomor WhatsApp</label>
      <input id="wa" type="tel" inputmode="tel" placeholder="08xxxxxxxxxx" required>
      <button class="btn blok" id="cek" style="margin-top:16px">Cek Status</button>
    </form>
    <div id="hasil"></div>
    <p class="footer"><a href="index.html">Kembali ke halaman acara</a></p>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>/* Cek file situs sinkron */(function(){var tampil=function(m){var d=document.createElement('div');d.setAttribute('style','background:#b4423a;color:#fff;padding:14px 16px;font:600 15px/1.5 system-ui,sans-serif;text-align:center');d.textContent=m;document.body.insertBefore(d,document.body.firstChild);};if(!window.App||window.App.VERSI!=='2026.11.26c'){tampil('Halaman belum bisa dipakai: file situs tidak sinkron (app.js berbeda versi). Panitia: unggah ulang SEMUA file folder web/ kecuali config.js.');}if(window.API_URL===undefined){tampil('Halaman belum bisa dipakai: config.js tidak ditemukan.');}})();</script>
  <script>
  (function () {
    var A = App;
    var terakhir = A.ambil('ws_terakhir');
    if (terakhir && terakhir.kode) A.$('#kode').value = terakhir.kode;
    if (A.param('k')) A.$('#kode').value = A.param('k');

    A.$('#form').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = A.$('#cek'), hasil = A.$('#hasil');
      btn.disabled = true;
      hasil.innerHTML = A.memuat('Mencari…');
      A.api('cekStatus', { kode: A.$('#kode').value.trim(), wa: A.$('#wa').value.trim() })
        .then(function (r) {
          var p = r.peserta;
          var h = '<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">';
          h += '<div><small>' + A.esc(p.acara.nama_acara) + '</small><h2 style="margin:0">' + A.esc(p.nama) + '</h2><small>' + A.esc(p.kode) + ' · ' + A.esc(p.jenis_nama) + '</small></div>' + A.badge(p.status) + '</div>';
          h += '<div class="ringkasan">';
          if (p.status === 'lunas' || p.status === 'hadir') {
            h += '<a class="btn blok" href="' + A.halaman('tiket.html', { t: p.token_tiket }) + '">Lihat E-Tiket</a>';
          } else if (p.status === 'menunggu_bayar' || p.status === 'ditolak' || p.status === 'menunggu_verifikasi') {
            if (p.status === 'ditolak') h += '<div class="banner danger">Alasan: ' + A.esc(p.alasan_tolak) + '</div>';
            h += '<a class="btn blok" href="' + A.halaman('bayar.html', { k: p.kode, a: p.akses }) + '">' + (p.status === 'menunggu_verifikasi' ? 'Lihat detail pembayaran' : 'Lanjutkan pembayaran') + '</a>';
          } else if (p.status === 'kedaluwarsa') {
            h += '<div class="banner warn">Batas waktu pembayaran sudah lewat. Jika Anda sudah transfer, hubungi panitia.</div>';
          } else if (p.status === 'batal') {
            h += '<div class="banner warn">Pendaftaran ini dibatalkan.</div>';
          }
          if (p.acara.kontak_wa) h += '<p style="text-align:center;margin-top:12px"><a target="_blank" rel="noopener" href="' + A.linkWA(p.acara.kontak_wa, 'Halo panitia, saya ' + p.nama + ' (kode ' + p.kode + '). ') + '">Butuh bantuan? Hubungi panitia</a></p>';
          h += '</div></div>';
          hasil.innerHTML = h;
        })
        .catch(function (err) { hasil.innerHTML = '<div class="banner danger">' + A.esc(err.message) + '</div>'; })
        .then(function () { btn.disabled = false; });
    });
  })();
  </script>
</body>
</html>
